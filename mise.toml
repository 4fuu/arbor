# The project-local toolchain: Node runs the TypeScript sources directly, so the
# tools this repository needs are Node and pnpm. mise installs both under
# ~/.local/share/mise, which is why this file exists instead of a system
# package.
#
# Versions: Node 24 or newer and pnpm 12, per .agents/setup.
[tools]
node = "26"
pnpm = "12"

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            # A re-run from main resumes the release its tag names.
            [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
              echo "Run releases from main or from a v<version> tag, not $GITHUB_REF" >&2
              exit 1
            }
            mapfile -t versions < <(jq -r '.version' packages/*/package.json | sort -u)
            [[ ${#versions[@]} -eq 1 ]] || {
              echo "every package must carry the same version; found ${versions[*]}" >&2
              exit 1
            }
            VERSION=${versions[0]}
            tag_sha=$(git rev-list -n 1 "v$VERSION" 2>/dev/null || true)
            [[ "$tag_sha" == "$GITHUB_SHA" ]] || {
              echo "Tag v$VERSION points to ${tag_sha:-nothing} instead of $GITHUB_SHA" >&2
              exit 1
            }
            echo "Resuming release v$VERSION"
          fi
          [[ "$VERSION" =~ ^[0-9]{4}\.[0-9]{3,4}\.[0-9]+$ ]] || {
            echo "Version $VERSION must use YYYY.MDD.REVISION" >&2
            exit 1
          }
          EXPECTED_PREFIX=$(TZ=Asia/Hong_Kong date '+%Y.%-m%d')
          [[ "$VERSION" == "$EXPECTED_PREFIX".* ]] || {
            echo "Version $VERSION does not match today's Asia/Hong_Kong date $EXPECTED_PREFIX" >&2
            exit 1
          }
          mapfile -t packages < <(jq -r '.version' packages/*/package.json | sort -u)
          [[ ${#packages[@]} -eq 1 && "${packages[0]}" == "$VERSION" ]] || {
            echo "every package must carry $VERSION; found ${packages[*]}" >&2
            exit 1
          }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  verify:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@9bbca1e9dc2902adb87e8780fe5c98796985a62d # v6.1.1
        with:
          version: 12
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test

  publish:
    needs: [validate, verify]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@9bbca1e9dc2902adb87e8780fe5c98796985a62d # v6.1.1
        with:
          version: 12
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Pack every package
        run: node scripts/publish.mjs
      - name: Publish every package
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          # The token names the secret and never holds its value: it is read from
          # the environment into npm's own configuration, which is not logged.
          printf '%s\n' "//registry.npmjs.org/:_authToken=$NPM_TOKEN" >> "$HOME/.npmrc"
          node scripts/publish.mjs --publish
